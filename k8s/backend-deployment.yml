apiVersion: apps/v1
kind: Deployment
metadata:
  name: finbank-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finbank-backend
  template:
    metadata:
      labels:
        app: finbank-backend
    spec:
      containers:
      - name: backend
        image: finbank-backend
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: postgres-service
        - name: DB_USER
          value: finbank
        - name: DB_PASSWORD
          value: finbank123
        - name: DB_NAME
          value: finbankdb
